<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lively Wallpapers</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080808;
      color: #f4f4f4;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main { width: min(760px, calc(100% - 32px)); }
    h1 { margin-bottom: 8px; }
    p { color: #aaa; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    a {
      display: block;
      padding: 18px;
      border: 1px solid #2b2b2b;
      border-radius: 12px;
      background: #111;
      color: #fff;
      text-decoration: none;
    }
    a:hover { background: #181818; }
  </style>
</head>
<body>
  <main>
    <h1>Lively Wallpapers</h1>
    <p>Escolha um wallpaper. As páginas abaixo podem ser adicionadas diretamente ao Lively.</p>
    <div class="grid">
      <a href="./sasuke/">Sasuke</a>
      <a href="./kali/">Kali</a>
      <a href="./vegeta/">Vegeta</a>
    </div>
  </main>
</body>
</html>
